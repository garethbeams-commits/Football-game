name: Build Football Game V49 APK

on:
  push:
    branches: [main]
    paths:
      - 'Football_Game_Android_Source_Upload.zip'
      - 'v44/**'
      - 'v45/**'
      - 'v46/**'
      - 'v47/**'
      - 'v48/**'
      - 'v49/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Fetch Android source
        uses: actions/checkout@v4

      - name: Unpack Android game source
        run: unzip -q Football_Game_Android_Source_Upload.zip -d .

      - name: Add 50 FBref-researched V44 players
        run: python3 v44/apply_roster.py

      - name: Add 380 V45 players (1,000 total)
        run: python3 v45/apply_roster.py

      - name: Add 250 V46 forgotten footballers (1,250 total)
        run: python3 v46/apply_roster.py

      - name: Verify V46 player build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          txt=Path('app/src/main/assets/www/index.html').read_text()
          a=txt.index('window.__CareerEmbedded=')+len('window.__CareerEmbedded=')
          b=txt.index(';</script>',a)
          data=json.loads(txt[a:b])
          cat=data['catalog']
          assert cat['count']==1250, cat['count']
          assert cat['category_counts']=={'men':1003,'women':247}, cat['category_counts']
          assert len(data['packs']['0007'])==125 and len(data['packs']['0008'])==125
          assert len(cat['entries'])==len({p['id'] for p in cat['entries']})
          assert sum(len(p['clubs']) for pack in data['packs'].values() for p in pack)==7028
          print('Verified V46 Android game: 1250 players, 7028 club clues.')
          PY

      - name: Add 250 V47 forgotten footballers (1,500 total)
        run: python3 v47/apply_roster.py

      - name: Verify V47 player build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          a=s.index('window.__CareerEmbedded=')+len('window.__CareerEmbedded=')
          data=json.loads(s[a:s.index(';</script>',a)])
          c=data['catalog']
          assert c['count']==1500, c['count']
          assert c['category_counts']=={'men':1203,'women':297}
          assert len(data['packs']['0009'])==125 and len(data['packs']['0010'])==125
          assert len(c['entries'])==len({x['id'] for x in c['entries']})
          assert sum(len(x['clubs']) for pack in data['packs'].values() for x in pack)==7890
          assert c['verified_count']==620
          print('Verified V47 Android game: 1500 players, 7890 career clues.')
          PY

      - name: Add 250 V48 forgotten footballers (1,750 total)
        run: python3 v48/apply_roster.py

      - name: Verify V48 player build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          a=s.index('window.__CareerEmbedded=')+len('window.__CareerEmbedded=')
          data=json.loads(s[a:s.index(';</script>',a)])
          c=data['catalog']
          assert c['count']==1750, c['count']
          assert c['category_counts']=={'men':1403,'women':347}, c['category_counts']
          assert len(data['packs']['0011'])==125 and len(data['packs']['0012'])==125
          assert len(c['entries'])==len({x['id'] for x in c['entries']})
          assert sum(len(x['clubs']) for pack in data['packs'].values() for x in pack)==8767
          assert c['verified_count']==620
          assert all(y[3] is None for pack in ('0011','0012') for x in data['packs'][pack] for y in x['clubs'])
          print('Verified V48 Android game: 1750 players, 8767 selected club clues.')
          PY

      - name: Add 250 V49 forgotten footballers (2,000 total)
        run: python3 v49/apply_roster.py

      - name: Verify V49 player build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('app/src/main/assets/www/index.html').read_text(encoding='utf8')
          a=s.index('window.__CareerEmbedded=')+len('window.__CareerEmbedded=')
          d=json.loads(s[a:s.index(';</script>',a)])
          c=d['catalog']
          assert c['count']==2000 and len(c['entries'])==2000
          assert c['category_counts']=={'men':1593,'women':407}
          assert len(d['packs']['0013'])==125 and len(d['packs']['0014'])==125
          assert sum(len(p['clubs']) for pack in d['packs'].values() for p in pack)==9834
          assert len({p['id'] for p in c['entries']})==2000
          assert c['verified_count']==620
          assert all(p['tier']==3 for pack in ('0013','0014') for p in d['packs'][pack])
          assert all(x[3] is None for pack in ('0013','0014') for p in d['packs'][pack] for x in p['clubs'])
          print('Verified V49: 2000 players; 9834 club stops; new appearance values empty')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Game-V49-2000-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
